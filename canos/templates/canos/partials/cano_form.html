<dialog id="modal-cano">
    <h2>Cadastrar cano</h2>

    <form id="form-cano" data-api-url="{% url 'api:cano-list' %}" data-method="POST" data-modal="modal-cano">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Cadastrar</button>
        <button type="button" class="btn-fechar-modal" data-modal="modal-cano">Cancelar</button>
    </form>
</dialog>
