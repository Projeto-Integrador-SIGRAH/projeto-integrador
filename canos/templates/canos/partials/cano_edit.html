<dialog id="modal-editar">
    <h2>Editar cano</h2>

    <form id="form-editar-cano" data-api-url="{% url 'api:cano-detail' pk=0 %}" data-method="PATCH">
        {% csrf_token %}

        {% for field in form %}
            <div>   
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Salvar</button>
        <button type="button" class="btn-fechar-modal" data-modal="modal-editar">Cancelar</button>
    </form>
</dialog>
