{% load static %}
{% load icons %}

<dialog
    id="modal-confirm-action"
    class="fixed inset-0 m-auto w-[calc(100%-2rem)] max-w-[34.5rem] overflow-hidden rounded-lg bg-white p-0 text-black shadow-2xl backdrop:bg-black/30"
>
    <div class="flex items-center justify-between bg-sky-600 px-4 py-3 text-white">
        <h2 id="modal-confirm-action-titulo" class="text-2xl font-bold">
            {{ title|default:"Excluir Cano" }}
        </h2>
        <button
            type="button"
            class="cursor-pointer text-black transition hover:opacity-60 close-confirm-action-modal"
        >
            {% icon "close" %}
        </button>
    </div>

    <div class="flex min-h-40 items-center justify-center px-6 py-8 text-center">
        <p id="modal-confirm-action-mensagem" class="text-xl font-bold">
            {{ message|default:"Deseja aceitar o acesso para José?" }}
        </p>
    </div>

    <div class="flex justify-end gap-4 border-t border-gray-300 px-6 py-2">
        <button
            type="button"
            class="rounded-lg border border-gray-400 px-3 py-2 font-semibold text-gray-500 transition hover:bg-gray-100 cursor-pointer close-confirm-action-modal"
        >
            Cancelar
        </button>
        <button
            type="button"
            class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white transition hover:bg-sky-700 cursor-pointer"
            id="modal-confirm-action-button"
        >
            {{ confirm_label|default:"Excluir" }}
        </button>
    </div>
    <script type="module" src="{% static 'js/confirm_action.js' %}"></script>
</dialog>
