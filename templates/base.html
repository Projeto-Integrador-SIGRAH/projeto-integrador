{% load icons %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>{% block title %} {% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% block extra_head %}{% endblock %}
    {% tailwind_css %}
</head>

<body class="bg-sky-50 text-black leading-normal tracking-normal">
    <main class="flex h-screen w-full">
        <aside class="flex flex-col justify-between h-full w-2/10 bg-sky-800 p-4 gap-4">
            <div class="flex flex-col">
                <div class="flex justify-center">
                    <img src="{% static 'img/Logo_sigrah.png' %}" alt="Logo" class="w-20 h-20 rounded-full">
                </div>
                <nav class="flex flex-col items-strech gap-4 text-white text-sm">
                    <a href="#" class="rounded-lg py-2.5 px-3 ">Painel</a>
                    <a href="#" class="bg-sky-950 rounded-lg py-2.5 px-3 drop-shadow-lg">Mapa</a>
                    <a href="#" class="rounded-lg py-2.5 px-3">Canos</a>
                    <a href="#" class="rounded-lg py-2.5 px-3">Alertas</a>
                    <a href="#" class="rounded-lg py-2.5 px-3">Administradores</a>
                </nav>
            </div>
            <form action="{% url 'api:logout' %}" method="post" class="flex justify-center items-center text-white" id="logout-form" data-login-url="{% url 'user:login' %}">
                {% csrf_token %}
                <button type="submit" class="flex items-center justify-center gap-5 cursor-pointer">
                    <span>Sair</span>
                    <span class="flex items-center justify-center p-2 bg-white rounded-full text-red-600">{% icon "logout" %}</span>
                </button>
            </form>
        </aside>
        <section class="flex-1">
            {% block content %}

            {% endblock %}
        </section>
    </main>
    {% block extra_scripts %}{% endblock %}
    <script src="{% static 'js/logout.js' %}"></script>
</body>
</html>
