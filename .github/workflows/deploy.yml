
name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            adryan1928/projeto-integrador:latest
            adryan1928/projeto-integrador:${{ github.sha }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
              set -euo pipefail

              cd /opt/projeto-integrador

              export DOCKERHUB_IMAGE="adryan1928/projeto-integrador:${IMAGE_TAG}"

              echo "Baixando nova imagem..."
              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                pull web

              echo "Iniciando PostgreSQL..."
              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                up -d --wait db

              echo "Executando migrations..."
              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                run --rm web python manage.py migrate

              echo "Atualizando aplicação..."
              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                up -d --no-deps web

              echo "Deploy concluído!"
              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                ps
          REMOTE
