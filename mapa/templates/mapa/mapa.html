{% extends "base.html" %}

{% block title %}Mapa{% endblock %}

{% block content %}
    <section style="height: 100%;" class="relative flex h-full min-w-0 flex-col  bg-sky-50">
        <div id="map" style="height: 100%;" aria-label="Mapa da cidade" style="z-index: 1;"></div>

        <!-- <div class="absolute left-10 top-6 z-[1000] flex w-[540px] items-center rounded-full bg-sky-50 px-4 py-3 shadow-md">
            <input type="search" placeholder="Busque pelo endereço ou código do cano" class="w-full bg-transparent text-base text-slate-700 outline-none placeholder:text-slate-400">
            <svg class="h-8 w-8 shrink-0 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>

        {% include "mapa/partials/map_layers_selector.html" %} -->
    </section>
{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css" integrity="sha256-P+hWJNlpL+GBSRYC7cdsDbQH91URmpDeOzLp7DbFRtE=" crossorigin="anonymous" />

<script type="importmap">
{
    "imports": {
        "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
    },
    "integrity": {
        "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js": "sha256-gj5JhNAaMi6LCs+jVFOk8sXDe1sWSS2Zlc87m+trLiQ="
    }
}
</script>
{% endblock %}

{% block extra_scripts %}
    <script type="module">
    import {LeafletMap, TileLayer} from 'leaflet';

    const map = new LeafletMap('map').setView([-6.11,-38.2], 15);

    new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'no-referrer-when-downgrade',
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
</script>
{% endblock %}
